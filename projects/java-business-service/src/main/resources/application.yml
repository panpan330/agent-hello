server:
  port: 8002

spring:
  application:
    name: java-business-service
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${JAVA_BUSINESS_DB_URL:jdbc:mysql://127.0.0.1:3306/ai_business?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${JAVA_BUSINESS_DB_USERNAME:root}
    password: ${JAVA_BUSINESS_DB_PASSWORD:}
  sql:
    init:
      mode: always
      encoding: UTF-8

app:
  internal:
    token: ${JAVA_BUSINESS_INTERNAL_TOKEN:local-dev-internal-token}
  persistence:
    orders: ${JAVA_BUSINESS_ORDER_PERSISTENCE:mysql}
