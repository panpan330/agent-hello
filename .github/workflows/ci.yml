name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Python regression
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run regression checks
        run: python scripts/run_regression.py

  eval-regression:
    name: Eval regression (daily)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: projects/ai-service
        run: uv sync --frozen

      - name: Run agent eval regression
        working-directory: projects/ai-service
        run: uv run python scripts/agent_eval.py --regression --report-path data/agent_eval/reports/ci-agent-report.md

      - name: Run production regression
        working-directory: projects/ai-service
        run: uv run python scripts/production_regression.py --report-path data/agent_eval/reports/ci-regression-report.md

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: projects/ai-service/data/agent_eval/reports/*.md
